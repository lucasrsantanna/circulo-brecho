<!DOCTYPE html>
<html>
<head>
    <title>Criar Produto de Teste</title>
</head>
<body>
    <h1>Criando produto de teste...</h1>
    <div id="result"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="/config.js"></script>

    <script>
        // Inicializar Firebase
        let app, db;
        try {
            app = firebase.initializeApp(window.CONFIG.FIREBASE_CONFIG);
            db = firebase.firestore();
        } catch (error) {
            console.error('Erro ao inicializar Firebase:', error);
        }

        // Criar produto de teste barato
        async function createTestProduct() {
            try {
                const productData = {
                    name: "TESTE - Produto R$ 1,00",
                    description: "Produto criado apenas para testar pagamentos com valor baixo",
                    price: 1.00,
                    category: "Blusas",
                    size: "M",
                    condition: "A",
                    brand: "Teste",
                    color: "#e9785f",
                    images: [],
                    status: "disponivel",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                const docRef = await db.collection('products').add(productData);
                
                document.getElementById('result').innerHTML = `
                    <p style="color: green;">✅ Produto criado com sucesso!</p>
                    <p><strong>ID:</strong> ${docRef.id}</p>
                    <p><strong>Nome:</strong> TESTE - Produto R$ 1,00</p>
                    <p><strong>Preço:</strong> R$ 1,00</p>
                    <hr>
                    <p>🛍️ <a href="/public/index.html" target="_blank">Ir para a loja e testar</a></p>
                `;
                
            } catch (error) {
                console.error('Erro ao criar produto:', error);
                document.getElementById('result').innerHTML = `<p style="color: red;">❌ Erro: ${error.message}</p>`;
            }
        }

        // Executar quando carregar
        document.addEventListener('DOMContentLoaded', createTestProduct);
    </script>
</body>
</html>
