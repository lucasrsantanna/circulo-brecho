<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Circulô Brechó</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-dark: #2b3f47;
            --brand-coral: #e9785f;
            --brand-mustard: #dca53a;
            --brand-blue: #3b6e7a;
            --bg: #f6efdf;
            --error: #dc3545;
            --success: #28a745;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--brand-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border: 1px solid #e8dec9;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 12px;
        }

        .brand-title {
            font-weight: 800;
            font-size: 24px;
            color: var(--brand-dark);
            margin: 0;
        }

        .brand-subtitle {
            font-size: 14px;
            color: #7b868b;
            margin: 4px 0 0 0;
        }

        .admin-badge {
            display: inline-block;
            background: var(--brand-coral);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--brand-dark);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e8dec9;
            border-radius: 12px;
            font-size: 16px;
            background: #fff;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--brand-dark);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--brand-dark);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background: #1e2d33;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
            margin-top: 10px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #7b868b;
        }

        .back-to-store {
            text-align: center;
            margin-top: 20px;
        }

        .back-to-store a {
            color: var(--brand-blue);
            text-decoration: none;
            font-size: 14px;
        }

        .back-to-store a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="/public/assets/logo.png" alt="Circulô Brechó" onerror="this.style.display='none'">
            <h1 class="brand-title">circulô</h1>
            <p class="brand-subtitle">brechó feminino</p>
            <span class="admin-badge">ÁREA ADMINISTRATIVA</span>
        </div>

        <div id="alertContainer"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email" class="form-label">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-input" 
                    required
                    placeholder="seu@email.com"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Senha</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    required
                    placeholder="••••••••"
                >
            </div>

            <button type="submit" class="btn" id="loginBtn">
                Entrar no Admin
            </button>

            <div class="loading" id="loading">
                Fazendo login...
            </div>
        </form>

        <div class="back-to-store">
            <a href="/public/index.html">← Voltar para a loja</a>
        </div>

        <div class="footer">
            <p>Acesso restrito • Circulô Brechó © <span id="year"></span></p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import das configurações
        import '/config.js';

        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // Elementos DOM
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loading = document.getElementById('loading');
        const alertContainer = document.getElementById('alertContainer');

        // Inicializar Firebase
        let app, auth;
        
        try {
            app = initializeApp(window.CONFIG.FIREBASE_CONFIG);
            auth = getAuth(app);
        } catch (error) {
            console.error('Erro ao inicializar Firebase:', error);
            showAlert('Erro de configuração. Verifique as credenciais do Firebase.', 'error');
        }

        // Verificar se usuário já está logado
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Usuário logado, redirecionar para dashboard
                window.location.href = './dashboard.html';
            }
        });

        // Função para mostrar alertas
        function showAlert(message, type = 'error') {
            const alertClass = type === 'error' ? 'alert-error' : 'alert-success';
            alertContainer.innerHTML = `
                <div class="alert ${alertClass}">
                    ${message}
                </div>
            `;
        }

        // Função para limpar alertas
        function clearAlerts() {
            alertContainer.innerHTML = '';
        }

        // Função para mostrar/ocultar loading
        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            loading.style.display = isLoading ? 'block' : 'none';
            
            if (isLoading) {
                loginBtn.textContent = 'Entrando...';
            } else {
                loginBtn.textContent = 'Entrar no Admin';
            }
        }

        // Handler do formulário de login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAlert('Por favor, preencha todos os campos.', 'error');
                return;
            }

            clearAlerts();
            setLoading(true);

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showAlert('Login realizado com sucesso! Redirecionando...', 'success');
                
                // Pequeno delay antes de redirecionar
                setTimeout(() => {
                    window.location.href = './dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('Erro no login:', error);
                
                let errorMessage = 'Erro ao fazer login. Tente novamente.';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'E-mail não cadastrado.';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'Senha incorreta.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'E-mail inválido.';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'Muitas tentativas. Tente novamente mais tarde.';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = 'Erro de conexão. Verifique sua internet.';
                        break;
                }
                
                showAlert(errorMessage, 'error');
            } finally {
                setLoading(false);
            }
        });

        // Atualizar ano no footer
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
